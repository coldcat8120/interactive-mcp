name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mcp aiohttp httpx

      - name: Syntax check
        run: python -m py_compile server.py broker.py

      - name: Verify MCP entry loads
        run: python -c "from server import mcp; print('MCP loaded OK')"
